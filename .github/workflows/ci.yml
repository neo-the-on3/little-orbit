# PR checks for little-orbit. Job names are stable so #9 can require them.
# Branch protection is not configured here.
#
# Required status check names are the job names. On a pull request they show as
# "CI / <job name>".
#
# Runners are standard hosted images only: ubuntu-latest and xcode-27.
# No larger runners, no paid add-ons, no secrets.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel older runs on the same ref. Pushes to main do not,
  # so a merge does not cancel the run for the commit it landed on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# contents: read checks out the repo. Cache save and restore use the runner
# cache token, so this workflow does not grant actions: write. No secrets.
# Job summaries append to GITHUB_STEP_SUMMARY. Artifact upload uses the
# runner artifact token. Neither needs a broader GITHUB_TOKEN permission.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04 # pinned until #144: SwiftLint needs libxml2 on 26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/setup-mise

      - name: Lint
        run: mise run lint

  format-check:
    name: format-check
    runs-on: ubuntu-24.04 # pinned until #144: SwiftLint needs libxml2 on 26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/setup-mise

      - name: Check formatting
        run: mise run format-check

  linux-tests:
    name: Linux tests
    runs-on: ubuntu-24.04 # pinned until #144: SwiftLint needs libxml2 on 26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/setup-mise

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Test Swift packages
        run: |
          set -euo pipefail

          packages=()
          # Same discovery as mise.toml [tasks.test]: every Package.swift outside dot directories.
          while IFS= read -r manifest; do
            packages+=("$(dirname "$manifest")")
          done < <(find . -name Package.swift -not -path '*/.*' | sort)

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Linux tests: no Package.swift in the tree, so swift test has nothing to run."
            echo "This job succeeds until a package is added. swift test then runs, and a failing test fails the job."
            exit 0
          fi

          # mise run test writes test-results/<package>.xml. On Swift 6.4.1 that
          # file contains XCTest cases only when the task passes --parallel.
          mise run test

      - name: Publish test summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r _; do
            found=1
            break
          done < <(find . -name Package.swift -not -path '*/.*' | sort)
          if [ "$found" -eq 1 ]; then
            python3 .github/scripts/summarize-test-results.py --require test-results
          else
            python3 .github/scripts/summarize-test-results.py test-results
          fi

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  validate-project:
    name: validate-project
    runs-on: ubuntu-24.04 # pinned until #144: SwiftLint needs libxml2 on 26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/setup-mise

      - name: Validate project.xcproj
        run: mise run validate-project

  apple:
    name: macOS build and test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.2
        run: |
          set -euo pipefail

          xcode_app="/Applications/Xcode_27.2.app"
          if [ ! -d "$xcode_app" ]; then
            echo "error: Xcode 27.2 is not installed at ${xcode_app}." >&2
            echo "The xcode-27 runner should provide that path (a symlink to the 27.2 beta until it is GA)." >&2
            echo "JSON project.xcproj files need Xcode 27.2 or newer. This job does not fall back to the image default." >&2
            echo "Xcode apps on this runner:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi

          sudo xcode-select -s "$xcode_app"
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcodebuild -version

          version="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          major="${version%%.*}"
          rest="${version#*.}"
          if [ "$version" = "$rest" ]; then
            minor="0"
          else
            minor="${rest%%.*}"
          fi
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
            echo "error: could not parse the Xcode version '${version}'." >&2
            exit 1
          fi
          if [ "$major" -lt 27 ] || { [ "$major" -eq 27 ] && [ "$minor" -lt 2 ]; }; then
            echo "error: ${xcode_app} reports Xcode ${version}, which is older than 27.2." >&2
            exit 1
          fi

          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

      - name: Install tools
        uses: ./.github/actions/setup-mise

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build and test iOS, macOS, and watchOS
        run: |
          set -euo pipefail

          project="LittleOrbit.xcodeproj"
          package=""
          while IFS= read -r manifest; do
            package="$manifest"
            break
          done < <(find . -name Package.swift -not -path '*/.*' | sort)
          if [ ! -d "$project" ] || [ -z "$package" ]; then
            echo "macOS build and test: skipped."
            if [ ! -d "$project" ]; then
              echo "Missing ${project}."
            fi
            if [ -z "$package" ]; then
              echo "Missing Package.swift."
            fi
            echo "Once both are in the tree, this job builds the three schemes with CODE_SIGNING_ALLOWED=NO, runs mise run test (xcrun swift), then xcodebuild test on each Swift package."
            echo "  LittleOrbit iOS     - iOS Simulator, iPhone 17, OS 27.0"
            echo "  LittleOrbit macOS   - macOS (arm64)"
            echo "  LittleOrbit watchOS - watchOS Simulator, Apple Watch Series 12 (42mm), OS 27.0"
            exit 0
          fi

          derived="derived-data"

          # The shared schemes' TestAction has no testables, so `xcodebuild test`
          # on those schemes exits 66: "Scheme ... is not currently configured for
          # the test action." Build the apps here. Package tests use Xcode's Swift
          # via mise, then xcodebuild test on the package writes an xcresult.
          run_scheme() {
            scheme="$1"
            destination="$2"
            echo "xcodebuild -project ${project} -scheme ${scheme} -destination ${destination} build CODE_SIGNING_ALLOWED=NO"
            xcodebuild \
              -project "$project" \
              -scheme "$scheme" \
              -destination "$destination" \
              -derivedDataPath "$derived" \
              build \
              CODE_SIGNING_ALLOWED=NO
          }

          run_scheme "LittleOrbit iOS" "platform=iOS Simulator,name=iPhone 17,OS=27.0"
          run_scheme "LittleOrbit macOS" "platform=macOS,arch=arm64"
          run_scheme "LittleOrbit watchOS" "platform=watchOS Simulator,name=Apple Watch Series 12 (42mm),OS=27.0"

          echo "mise run test"
          test_status=0
          mise run test || test_status=$?

          # swift test on macOS does not write an xcresult. xcodebuild test on the
          # package scheme does. Run it even when mise run test failed so the
          # bundle still records the failure.
          root="$PWD"
          mkdir -p test-results
          while IFS= read -r manifest; do
            package_root="$(dirname "$manifest")"
            name="$(basename "$package_root")"
            bundle="${root}/test-results/${name}.xcresult"
            rm -rf "$bundle"
            # A package with more than one product has no scheme named after the
            # package. Xcode adds "<package>-Package", which tests every test
            # target. A single-product package uses the package name.
            if ! scheme="$(cd "$package_root" && xcodebuild -list -json | python3 -c '
          import json, sys

          name = sys.argv[1]
          info = json.load(sys.stdin)
          info = info.get("workspace") or info.get("project") or {}
          schemes = info.get("schemes") or []
          for candidate in (name + "-Package", name):
              if candidate in schemes:
                  print(candidate)
                  sys.exit(0)
          sys.exit("error: no %s-Package or %s scheme. Schemes: %s" % (name, name, ", ".join(schemes)))
          ' "$name")"; then
              test_status=1
              continue
            fi
            echo "xcodebuild test -scheme ${scheme} -destination platform=macOS,arch=arm64 -resultBundlePath ${bundle} -test-timeouts-enabled YES"
            # A hung test fails in minutes instead of running into the job's timeout: XCTest cases get 2 minutes
            # each (5 at most), and the Swift Testing suites that wait on gates or the run loop carry
            # .timeLimit(.minutes(2)).
            if ! (
              cd "$package_root"
              xcodebuild test \
                -scheme "$scheme" \
                -destination "platform=macOS,arch=arm64" \
                -resultBundlePath "$bundle" \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 120 \
                -maximum-test-execution-time-allowance 300 \
                -derivedDataPath "${root}/derived-data-${name}" \
                CODE_SIGNING_ALLOWED=NO
            ); then
              test_status=1
            fi
          done < <(find . -name Package.swift -not -path '*/.*' | sort)

          exit "$test_status"

      - name: Publish test summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found=0
          if [ -d LittleOrbit.xcodeproj ]; then
            while IFS= read -r _; do
              found=1
              break
            done < <(find . -name Package.swift -not -path '*/.*' | sort)
          fi
          if [ "$found" -eq 1 ]; then
            python3 .github/scripts/summarize-test-results.py --require test-results
          else
            python3 .github/scripts/summarize-test-results.py test-results
          fi

      # Catches app bundles that build but are rejected at install time (#77).
      # Simulators are chosen by UDID, never by name: a Mac can have two
      # devices with the same name. Uses the simulator builds above in
      # derived-data. Signing stays off; nothing here needs a signed build.
      - name: Install apps on simulators
        run: |
          set -euo pipefail

          project="LittleOrbit.xcodeproj"
          products="derived-data/Build/Products"
          if [ ! -d "$project" ]; then
            echo "Install apps on simulators: skipped. Missing ${project}."
            exit 0
          fi

          # Prints the UDID of an available simulator for a platform, preferring
          # the 27.2 runtime and otherwise the newest 27.x runtime installed.
          # Devices are sorted by name, then UDID, so the pick is stable.
          pick_simulator() {
            platform="$1"
            name_prefix="$2"
            xcrun simctl list devices available -j | python3 -c '
          import json, re, sys

          platform, name_prefix = sys.argv[1], sys.argv[2]
          wanted = (27, 2)
          runtimes = {}
          for key, devices in json.load(sys.stdin)["devices"].items():
              # Exact runtime id, optionally with a device-specific suffix such as
              # iOS-27-2-iPhone19-4. Runtimes with the same version merge their devices.
              match = re.fullmatch(
                  r"com\.apple\.CoreSimulator\.SimRuntime\.%s-(\d+)-(\d+)(?:-.+)?" % re.escape(platform), key
              )
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              if version[0] != wanted[0]:
                  continue
              matching = [d for d in devices if d["name"].startswith(name_prefix)]
              if matching:
                  runtimes.setdefault(version, []).extend(matching)
          if not runtimes:
              sys.exit("error: no available %s 27.x simulator named %s*." % (platform, name_prefix))
          version = wanted if wanted in runtimes else max(runtimes)
          if version != wanted:
              print("warning: no %s 27.2 runtime; using %d.%d." % ((platform,) + version), file=sys.stderr)
          device = sorted(runtimes[version], key=lambda d: (d["name"], d["udid"]))[0]
          print("%s %d.%d: %s (%s)" % ((platform,) + version + (device["name"], device["udid"])), file=sys.stderr)
          print(device["udid"])
          ' "$platform" "$name_prefix"
          }

          install_app() {
            platform="$1"
            name_prefix="$2"
            app="$3"
            if [ ! -d "$app" ]; then
              echo "error: ${app} was not built." >&2
              exit 1
            fi
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Info.plist")"
            udid="$(pick_simulator "$platform" "$name_prefix")"

            echo "xcrun simctl bootstatus ${udid} -b"
            xcrun simctl bootstatus "$udid" -b
            echo "xcrun simctl install ${udid} ${app}"
            xcrun simctl install "$udid" "$app"
            echo "xcrun simctl launch ${udid} ${bundle_id}"
            xcrun simctl launch "$udid" "$bundle_id"
            xcrun simctl terminate "$udid" "$bundle_id" || true
            xcrun simctl shutdown "$udid" || true
          }

          install_app watchOS "Apple Watch" "${products}/Debug-watchsimulator/LittleOrbitWatch.app"
          install_app iOS "iPhone" "${products}/Debug-iphonesimulator/LittleOrbit.app"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
