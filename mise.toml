# Tool versions for little-orbit.
#
# Local machines and CI install with `mise install` and run tasks with `mise run`.
#
# Platforms
# - swift.org Swift 6.4.1 installs on Linux only (`os = ["linux"]`). Its macOS
#   toolchain cannot build Packages/LittleOrbitKit for Apple platforms.
# - On macOS, `test`, `format`, and `format-check` call Xcode's toolchain with
#   `xcrun swift` and `xcrun swift-format` (Xcode 27.2 or newer).
# - swift-format on Linux is the `swift-format` binary in the pinned toolchain.
# - SwiftLint and xcprojformatter install on Linux and macOS.
# - xcodebuild ships with Xcode 27.2 or newer. The `build` task is macOS-only.
#
# Fallback: if the JSON project.xcproj format cannot be used, add XcodeGen with
# mise in that change and record why.

[tools]
# Official SwiftLint release binaries for Linux and macOS.
"aqua:realm/SwiftLint" = "0.65.1"

# swift.org Swift 6.4.1 (Xcode 27 line), Linux only. Also provides Apple's
# swift-format 6.4.1 there. `os` is a host filter, not a lockfile option, so
# mise.lock still records the Linux entry (swift_platform = "ubuntu24.04")
# and the macOS swift.org URLs `mise lock` writes for other platforms.
# `mise install` skips this tool on macOS.
[tools.swift]
version = "6.4.1"
os = ["linux"]

# apple/xcode-project-format tag 0.1.0. The tag has no GitHub release assets,
# so mise builds this commit from source. Linux uses the pinned Swift toolchain
# (`depends` below). macOS skips that toolchain and builds with Xcode's swift.
[tools."spm:apple/xcode-project-format"]
version = "rev:c132630aabf40f6d6c3f7bb004595d2e5a28ea42"
depends = ["swift"]
artifactbundle = false
filter_bins = ["xcprojformatter"]

[tasks.lint]
description = "Lint Swift sources with SwiftLint using .swiftlint.yml (Linux and macOS)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

sources=()
while IFS= read -r file; do
  sources+=("$file")
done < <(find . -name '*.swift' -not -path '*/.*' | sort)

if [ -z "${sources[*]:-}" ]; then
  echo "lint: no Swift sources to lint."
  exit 0
fi

swiftlint
'''

[tasks.format]
description = "Rewrite Swift sources in place with swift-format using .swift-format (Linux: pinned toolchain; macOS: xcrun swift-format)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ "$(uname -s)" = "Darwin" ]; then
  if ! xcrun --find swift-format >/dev/null 2>&1; then
    echo "error: format on macOS uses Xcode's swift-format via \`xcrun swift-format\`." >&2
    echo "Install Xcode 27.2 or newer and point xcode-select at it." >&2
    exit 1
  fi
  swift_format=(xcrun swift-format)
else
  swift_format=(swift-format)
fi

"${swift_format[@]}" format --in-place --recursive .
'''

[tasks."format-check"]
description = "Fail if swift-format would change Swift sources, using .swift-format (Linux: pinned toolchain; macOS: xcrun swift-format)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ "$(uname -s)" = "Darwin" ]; then
  if ! xcrun --find swift-format >/dev/null 2>&1; then
    echo "error: format-check on macOS uses Xcode's swift-format via \`xcrun swift-format\`." >&2
    echo "Install Xcode 27.2 or newer and point xcode-select at it." >&2
    exit 1
  fi
  swift_format=(xcrun swift-format)
else
  swift_format=(swift-format)
fi

"${swift_format[@]}" lint --strict --recursive .
'''

[tasks.test]
description = "Run swift test for each Swift package (Linux: pinned Swift 6.4.1, parallel, JUnit in test-results/; macOS: xcrun swift)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ "$(uname -s)" = "Darwin" ]; then
  if ! xcrun --find swift >/dev/null 2>&1; then
    echo "error: test on macOS uses Xcode's Swift via \`xcrun swift\`." >&2
    echo "Install Xcode 27.2 or newer and point xcode-select at it." >&2
    exit 1
  fi
  swift=(xcrun swift)
else
  swift=(swift)
fi

packages=()
while IFS= read -r manifest; do
  packages+=("$(dirname "$manifest")")
done < <(find . -name Package.swift -not -path '*/.*' | sort)

if [ -z "${packages[*]:-}" ]; then
  echo "error: no Package.swift found, so there are no Swift package tests to run." >&2
  echo "This task runs swift test --package-path in each package once those packages are in the tree." >&2
  exit 1
fi

for package_dir in "${packages[@]}"; do
  args=(test --package-path "$package_dir")
  if [ "$(uname -s)" != "Darwin" ]; then
    # Swift 6.4.1 writes XCTest cases into --xunit-output only for the parallel
    # runner. A serial run leaves an empty *-swift-testing.xml file and no
    # XCTest report (swiftlang/swift-package-manager#9961).
    name="$(basename "$package_dir")"
    mkdir -p test-results
    report="test-results/${name}.xml"
    args+=(--parallel --xunit-output "$report")
  fi
  echo "${swift[*]} ${args[*]}"
  "${swift[@]}" "${args[@]}"
  if [ "$(uname -s)" != "Darwin" ]; then
    if [ ! -s "$report" ] || ! grep -q "<testcase" "$report"; then
      echo "error: ${report} has no XCTest cases." >&2
      echo "Swift 6.4.1 writes that file only when tests run with --parallel." >&2
      exit 1
    fi
  fi
done
'''

[tasks.build]
description = "Build shared Xcode schemes with xcodebuild (macOS only, Xcode 27.2 or newer). Package code uses swift build on Linux and macOS."
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Require Xcode 27.2+ before any other build step. `xcodebuild -version`
# prints "Xcode <marketing-version>" on the first line.
version_output=""
if ! version_output="$(xcodebuild -version 2>&1)"; then
  echo "error: build requires Xcode 27.2 or newer, but \`xcodebuild -version\` failed." >&2
  if [ "$(uname -s)" != "Darwin" ]; then
    echo "This task is macOS-only. xcodebuild ships with Xcode." >&2
    echo "Shared Swift packages build on Linux and macOS with: swift build" >&2
  else
    echo "Install Xcode 27.2 or newer and point xcode-select at it." >&2
    printf '%s\n' "$version_output" >&2
  fi
  exit 1
fi

version_line="${version_output%%$'\n'*}"
case "$version_line" in
  "Xcode "[0-9]*)
    version="${version_line#Xcode }"
    ;;
  *)
    echo "error: build requires Xcode 27.2 or newer. \`xcodebuild -version\` reported: ${version_line}" >&2
    exit 1
    ;;
esac

IFS=. read -r major minor _ <<EOF
$version
EOF
major="${major%%[!0-9]*}"
minor="${minor%%[!0-9]*}"
major="${major:-0}"
minor="${minor:-0}"
if [ "$major" -lt 27 ] || { [ "$major" -eq 27 ] && [ "$minor" -lt 2 ]; }; then
  echo "error: build requires Xcode 27.2 or newer. \`xcodebuild -version\` reported: ${version_line}" >&2
  exit 1
fi

project="LittleOrbit.xcodeproj"
if [ ! -d "$project" ]; then
  echo "error: ${project} is not in the tree, so xcodebuild has nothing to build." >&2
  exit 1
fi

schemes=()
in_schemes=0
while IFS= read -r line; do
  case "$line" in
    "    Schemes:")
      in_schemes=1
      ;;
    "")
      if [ "$in_schemes" -eq 1 ]; then
        break
      fi
      ;;
    *)
      if [ "$in_schemes" -eq 1 ]; then
        schemes+=("${line#"${line%%[![:space:]]*}"}")
      fi
      ;;
  esac
done < <(xcodebuild -project "$project" -list)

if [ -z "${schemes[*]:-}" ]; then
  echo "error: ${project} has no shared schemes." >&2
  exit 1
fi

for scheme in "${schemes[@]}"; do
  echo "xcodebuild -project ${project} -scheme ${scheme} build"
  xcodebuild -project "$project" -scheme "$scheme" build CODE_SIGNING_ALLOWED=NO "$@"
done
'''

[tasks."validate-project"]
description = "Check project.xcproj files with xcprojformatter, and that app code never uses a SwiftData context of its own (Linux and macOS)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

# #265: SwiftDataLedgerRepository owns its ModelContext, with autosave off, and drops it after a failed write.
# Nothing else in the apps may use a context of the store: no mainContext, @Query or SwiftUI modelContext. The
# repository's own file may name mainContext only in its /// documentation lines. Tests may read a record's
# modelContext. #285 B: the one exception is the BackgroundLedgerWriter model actor the repository makes for one
# batch save, which may name its own modelContext. The exemption is pinned to that type's body: the lines from
# `actor BackgroundLedgerWriter {` to its closing brace at the same indent, in BackgroundLedgerWriter.swift. Any
# other type in that file, or anywhere else, is refused, and mainContext and @Query are refused in the actor too.
status=0
context_paths=()
for path in Apps Packages/LittleOrbitKit/Sources; do
  if [ -d "$path" ]; then
    context_paths+=("$path")
  fi
done
if [ -n "${context_paths[*]:-}" ]; then
  writer_file='Packages/LittleOrbitKit/Sources/LittleOrbitPersistence/BackgroundLedgerWriter.swift'
  writer_first=0
  writer_last=0
  if [ -f "$writer_file" ]; then
    read -r writer_first writer_last < <(awk '
      first == 0 && match($0, /^[[:space:]]*actor BackgroundLedgerWriter[[:space:]]*\{/) {
        first = NR
        indent = substr($0, 1, index($0, "actor") - 1)
        next
      }
      first != 0 && last == 0 && $0 == indent "}" { last = NR }
      END { print first + 0, last + 0 }
    ' "$writer_file")
  fi
  context_uses="$(grep -rnE --include='*.swift' '(\bmainContext\b|@Query\b|\bmodelContext\b)' "${context_paths[@]}" \
    | grep -vE '^Packages/LittleOrbitKit/Sources/LittleOrbitPersistence/SwiftDataLedgerRepository\.swift:[0-9]+:[[:space:]]*///' \
    | awk -v writer="${writer_file}:" -v first="$writer_first" -v last="$writer_last" '
        index($0, writer) != 1 || /mainContext|@Query/ { print; next }
        {
          rest = substr($0, length(writer) + 1)
          line = substr(rest, 1, index(rest, ":") - 1) + 0
          if (first == 0 || last == 0 || line <= first || line >= last) print
        }' \
    || true)"
  if [ -n "$context_uses" ]; then
    echo "error: app code uses a SwiftData context; only SwiftDataLedgerRepository may (docs/persistence-migration.md, Writes):" >&2
    echo "$context_uses" >&2
    status=1
  fi
fi

files=()
while IFS= read -r file; do
  files+=("$file")
done < <(find . -name project.xcproj -not -path '*/.*' | sort)

if [ -z "${files[*]:-}" ]; then
  echo "validate-project: no project.xcproj files found."
  exit "$status"
fi

for file in "${files[@]}"; do
  canonical="$(mktemp)"
  if ! xcprojformatter "$file" >"$canonical"; then
    echo "error: xcprojformatter could not read ${file}." >&2
    status=1
    rm -f "$canonical"
    continue
  fi
  if ! diff -u "$file" "$canonical"; then
    echo "error: ${file} differs from xcprojformatter canonical output." >&2
    echo "Rewrite it with: xcprojformatter --update <project>.xcodeproj" >&2
    status=1
  fi
  rm -f "$canonical"
done

exit "$status"
'''
